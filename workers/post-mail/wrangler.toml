name = "jonas-post-mail"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "jonasjuchelka/jonasjuchelka.github.io"
BRANCH = "main"
# Absender der Bestätigungsmail (über Resend). Die Domain muss bei Resend verifiziert sein.
MAIL_FROM = "Gedanken <post@jonasjuchelka.com>"
# Diese drei Variablen stehen bewusst NICHT hier, sondern nur im Cloudflare-Dashboard
# (Worker → Settings → Variables), damit weder deine Adresse noch die geheime Adresse im öffentlichen Repo stehen:
#   ALLOWED_SENDERS   = deine Absenderadresse (kommagetrennt, wenn mehrere)
#   SECRET_LOCAL_PART = geheimer Teil vor dem @ der Empfangsadresse
#   PUBLIC_URL        = https://<worker-name>.<konto>.workers.dev
# Würden sie hier mit Platzhalter stehen, überschreibt jedes "wrangler deploy" die Dashboard-Werte.
# Deploy immer mit: wrangler deploy --keep-vars

# KV für den Tageszähler. Die id ist kein Geheimnis (ohne Konto-Zugang nutzlos).
[[kv_namespaces]]
binding = "STATE"
id = "469437a2ed4c4c539b3c04c8bfefd9a5"

# Secrets (nie in diese Datei): wrangler secret put GITHUB_TOKEN / UNPUBLISH_SECRET / RESEND_API_KEY
