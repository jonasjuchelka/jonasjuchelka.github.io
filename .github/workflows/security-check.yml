name: Security check (private area)
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, read-only smoke test against production
  workflow_dispatch:
    inputs:
      url:
        description: Base URL
        default: https://jonas-private.vercel.app
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node artifacts/private-dashboard/scripts/security-check.mjs "$BASE_URL"
        env:
          BASE_URL: ${{ inputs.url || 'https://jonas-private.vercel.app' }}
