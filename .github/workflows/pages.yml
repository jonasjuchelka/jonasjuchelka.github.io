name: Public website checks and Pages
on:
  pull_request:
  push:
    branches: [main, replit-website-sync]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/jonas-website build
        env:
          # Public, non-secret: fixed HTTPS origin of the private area (Vercel).
          NEXT_PUBLIC_PRIVATE_APP_ORIGIN: https://jonas-private.vercel.app
          # Public, non-secret: HTTPS URL of the live-translation proxy. Unset repository variable hides the live option.
          NEXT_PUBLIC_TRANSLATE_ENDPOINT: ${{ vars.TRANSLATE_ENDPOINT }}
      - run: pnpm --filter @workspace/jonas-website typecheck
      - run: node --test artifacts/jonas-website/scripts/dev-origins.test.mjs tests/pages-export.test.mjs tests/translate-worker.test.mjs
      - run: node scripts/verify-pages-export.mjs --manifest
      - run: pnpm --filter @workspace/private-dashboard build
      - run: pnpm --filter @workspace/private-dashboard typecheck
      - run: pnpm --filter @workspace/scripts exec tsx --test ../tests/policy.test.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/jonas-website/out
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'jonasjuchelka/jonasjuchelka.github.io'
    needs: public
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
