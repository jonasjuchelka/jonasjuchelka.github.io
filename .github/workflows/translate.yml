name: Update translations
# Daily: translate whatever changed in the German source (UI texts and content), verify the site builds,
# and open or update ONE pull request. Nothing is published: deploying stays a manual run of pages.yml.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: translations
  cancel-in-progress: false
jobs:
  translate:
    if: github.repository == 'jonasjuchelka/jonasjuchelka.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Translate changed sources
        id: translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Unchanged sources are skipped via the hash cache, so a quiet day makes no API calls.
          if node artifacts/jonas-website/scripts/translate.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check for changes
        id: diff
        run: |
          git add -A artifacts/jonas-website/src/i18n artifacts/jonas-website/content
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Verify the site builds with the new translations
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm --filter @workspace/jonas-website build
          pnpm --filter @workspace/jonas-website typecheck
          node scripts/verify-pages-export.mjs
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/translations
          git commit -m "Update translations"
          git push --force origin bot/translations
          if [ -z "$(gh pr list --head bot/translations --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head bot/translations --title "Update translations" \
              --body "Automatic translation of changed German sources (UI texts and content). The build and export check passed in the workflow. Skim a language you know, merge, then start the Pages workflow to publish."
          fi
      - name: Fail the run if a translation failed
        if: steps.translate.outputs.ok == 'false'
        run: exit 1
