kind = "web"
previewPath = "/private/"
title = "Privater Bereich"
description = "Getrennte Next.js-Anwendung mit ausschließlich Passkey-basiertem Zugang, Einladungen und Tool-Freigaben."
version = "1.0.0"
id = "artifacts/private-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/private/" ]
localPort = 26050

[services.development]
run = "pnpm --filter @workspace/private-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/private-dashboard", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/private-dashboard", "run", "start" ]


[services.env]
PORT = "26050"
BASE_PATH = "/private/"
